<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Casino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="chip"></span><span id="siteName">Casino</span></div>

  <!-- Not `class="row wrap"`: `.wrap` is the page-container class (max-width 1280 and
       20px of vertical padding), so the nav was quietly wearing 40px of page padding and
       was the tallest thing in the bar. It scrolls sideways now instead of wrapping. -->
  <nav class="row" id="navGames"></nav>

  <span class="spacer"></span>

  <div class="mode-switch hide" id="modeSwitch" role="group">
    <button data-wallet="real" class="on" data-i18n="demo.real">Real</button>
    <button data-wallet="demo" data-i18n="demo.practice">Practice</button>
    <button data-wallet="token" data-i18n="tok.wallet">Tugriks</button>
  </div>

  <div class="balance" id="balanceBox" hidden>
    <span class="label" data-i18n="nav.balance">Balance</span>
    <span class="value" id="balanceValue">0.00000000</span>
    <span class="label" id="currencyLabel">CRD</span>
  </div>

  <button class="ghost tiny sound-toggle" id="btnSound" data-i18n-title="sound.toggle">&#9834;</button>

  <select class="lang-select" id="langSelect" data-i18n-title="common.language"></select>

  <div class="row" id="authButtons">
    <button class="ghost tiny" id="btnSignin" data-i18n="nav.signin">Sign in</button>
    <button class="primary tiny" id="btnSignup" data-i18n="nav.signup">Register</button>
  </div>

  <!-- Seven account buttons used to sit here in a row of their own, which is most of the
       reason the header was three bands tall. They are all things you press between games,
       never during one, so they live behind this button now. -->
  <div class="menu hide" id="accountMenu">
    <button class="ghost tiny menu-trigger" id="btnAccount" aria-haspopup="true"
            aria-expanded="false" aria-controls="userButtons" data-i18n="nav.account">Account</button>
    <div class="menu-panel" id="userButtons" hidden>
      <button class="menu-item" id="btnWallet" data-i18n="nav.wallet">Wallet</button>
      <button class="menu-item" id="btnFair" data-i18n="nav.fair">Fairness</button>
      <button class="menu-item" id="btnAff" data-i18n="nav.affiliate">Referrals</button>
      <button class="menu-item" id="btnLimits" data-i18n="nav.limits">Limits</button>
      <button class="menu-item" id="btnToken" data-i18n="tok.nav">Token</button>
      <a class="menu-item hide" id="btnAdmin" href="/admin" data-i18n="nav.admin">Admin</a>
      <div class="menu-sep"></div>
      <button class="menu-item" id="btnSignout" data-i18n="nav.signout">Sign out</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="banners"></div>

  <div class="layout">
    <!-- bet controls, rebuilt per game -->
    <div>
      <div class="panel" id="betPanel"></div>
      <div class="panel" id="infoPanel"></div>
    </div>

    <!-- game stage plus the activity feed -->
    <div>
      <div class="stage" id="stage"></div>

      <div class="panel" style="margin-top:16px">
        <div class="tabs" id="feedTabs">
          <button class="on" data-feed="recent" data-i18n="feed.recent">Latest bets</button>
          <button data-feed="biggest" data-i18n="feed.biggest">Biggest wins</button>
          <button data-feed="mine" data-i18n="feed.mine">My bets</button>
        </div>
        <div class="table-wrap scroll-y" id="feedBody"></div>
      </div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
